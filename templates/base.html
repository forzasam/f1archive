<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}F1 Archive{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{{ url_for('home.index') }}">
            <span class="brand-mark">F1</span>
            <span>Archive</span>
        </a>
        <nav>
            <a href="{{ url_for('home.index') }}">Seasons</a>
        </nav>
    </header>

    <main class="page-shell">
        {% block content %}{% endblock %}
    </main>

    <footer>
        Historical results supplied by Jolpica-F1. Editorial events and circuit
        maps will be added separately.
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
