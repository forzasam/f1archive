<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}F1 Archive{% endblock %}</title>

    <!-- Favicons -->
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32x32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon-16x16.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">

    <!-- Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{{ url_for('home.index') }}">
            <span class="brand-mark">F1</span>
            <span class="brand-copy">
                <strong>Archive</strong>
                <small>Independent Formula One archive</small>
            </span>
        </a>

        <nav class="site-nav" aria-label="Primary navigation">
            <a
                href="{{ url_for('home.index') }}"
                {% if request.endpoint == 'home.index' or request.blueprint in ('seasons', 'races') %}aria-current="page"{% endif %}
            >Seasons</a>
            <a
                href="{{ url_for('pages.about') }}"
                {% if request.endpoint == 'pages.about' %}aria-current="page"{% endif %}
            >About</a>
            <a
                href="{{ url_for('pages.contact') }}"
                {% if request.endpoint == 'pages.contact' %}aria-current="page"{% endif %}
            >Contact</a>
            {# Future public links can be added here when ready:
               <a href="...">GitHub</a>
               <a href="...">Discord</a>
            #}
        </nav>
    </header>

    <main class="page-shell">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <span>Historical results supplied by Jolpica-F1.</span>
        <span class="footer-links">
            <a href="{{ url_for('pages.about') }}">About</a>
            <a href="{{ url_for('pages.contact') }}">Contact</a>
        </span>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
